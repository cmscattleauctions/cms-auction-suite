<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Country Page Manager</title>
  <meta name="description" content="Cattle Marketing Services — Internal Lot Management Tool">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>★</text></svg>">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="light-theme.css">
  <link rel="stylesheet" href="../shared/skeleton.css">

  <!-- Firestore data layer, backed by the suite's shared Firebase project
       (module scripts run before DOMContentLoaded, so it's installed
       before the app boots) -->
  <script type="module" src="./firestore-adapter.js"></script>
  <!-- app.js below is a classic (non-module) script, so it can't
       `import` shared/skeleton.js directly — bridge just the one
       function it needs onto window, same pattern as
       firestore-adapter.js/shared/cms-data.js already use for this
       exact classic-script/ES-module boundary. Runs before app.js's
       own showLoadingScreen() is ever called (see that comment). -->
  <script type="module">
    import { skeletonHtml } from '../shared/skeleton.js';
    window.skeletonHtml = skeletonHtml;
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- App mounts here -->
    <div class="loading-screen">
      <div class="loading-logo">★</div>
      <div class="loading-text">Loading CMS…</div>
    </div>
  </div>

  <!-- App -->
  <script src="app.js"></script>
</body>
</html>
