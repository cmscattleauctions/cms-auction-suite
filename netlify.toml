# Netlify configuration for CMS Auction Suite
#
# This is a static site with no build step. Netlify just serves the
# contents of `public/` directly.
#
# To change the publish directory later, edit `publish` below.

[build]
  publish = "public"
  command = ""

# Serverless functions (Lot Images thumbnail proxy lives here)
[functions]
  directory = "netlify/functions"

# Firebase web API keys are intentionally public (client-side config —
# real security is Firebase Auth + Firestore rules), but Netlify's
# secrets scanner flags the "AIza..." pattern. Skip that one file.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "public/shared/firebase-config.js"

# SPA-style fallback for the shell. If a user reloads at /listings,
# /banners, etc. and there's no exact file match, fall through to
# index.html so the shell can route them to the right tab.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Sensible default headers. Tighten CSP later if needed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# This site is a set of single-file pages (no build-hashed asset filenames), so
# there's no natural cache-busting when index.html changes — a browser (or an
# intermediate CDN) holding a stale cached copy of a page's HTML has no way to
# know a new deploy exists, and keeps serving the old JS/CSS/markup until its
# cache happens to expire or the user manually hard-refreshes. That produced
# several rounds in this project's history where a fix had already shipped but
# testing against a stale cached page still showed the old (broken) behavior.
# "no-cache" here does NOT mean "never cache" — it means the browser must
# revalidate with the server (a fast conditional request) before using any
# cached copy, so a normal reload always reflects the latest deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
